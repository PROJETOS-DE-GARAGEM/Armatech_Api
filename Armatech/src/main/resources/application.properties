spring.application.name=Armatech

spring.datasource.url=jdbc:postgresql://localhost:5432/armatech
spring.datasource.username=postgres
spring.datasource.password=123456


spring.datasource.driver-class-name=org.postgresql.Driver
server.tomcat.relaxed-query-chars=|,{,},[,]

# Hibernate configuraes de JPA
spring.jpa.hibernate.ddl-auto=update



# Outras propriedades recomendadas
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true



#Chave primria secreta para descriptografar
api.security.token.secret=naruto-e-melhor-que-one-piece

